# 服务器出墙要用、但服务器自己拿不到的两样东西，定时抓下来推到 relay-assets 分支：
#   1. attestation-status.json  —— Google 的 keybox 吊销名单（公开数据，明文推）
#   2. clash-subscription.enc   —— 机场订阅转出来的 mihomo 节点表，**加密后才推**
#
# 为什么绕这一道：服务端（腾讯云那台）直连不到 android.googleapis.com，也连不到
# 机场的订阅站（试了，连接超时），但 raw.githubusercontent.com 是通的。东西走仓库
# 过一手，服务器就有地方拿；服务器上那个 mihomo 再拿它去发真正出墙的请求。
#
# 为什么节点表必须加密：这个仓库是 public。节点表里带着节点地址、UUID/密码，明文推
# 出去等于把整份订阅挂在公网上（2026-09-28 真出过一次，已清理并改成现在这样）。口令
# 只放两处：仓库 secret SUB_PASSPHRASE，和服务器上的 /etc/mihomo/relay-assets.key。
# 服务器那边的 ommega-relay-assets.sh 解密后再写进 mihomo 的 provider 文件。
# 订阅链接本身也别写进这个文件——同样是因为 public，它只放仓库 secret CLASH_SUB_URL。
#
# 抓订阅为什么不用 clash 类 UA：拿 clash 系客户端的 UA 去请求，回来的 proxies 全是
# 占位货（名字写着「不支持您的代理软件」，server 一律 127.0.0.1:6666），一个真节点
# 都没有；换成 mihomo 的 UA，回来的是 base64 的真实节点。所以这里用 mihomo 的 UA
# 抓，再自己转格式（.github/scripts/sub_to_clash.js）。
#
# 分支上只有这两个文件（orphan，不带仓库快照），每次 force-push 覆盖，永远只有一个
# commit，不会越积越厚。服务器读 raw，CDN 缓存最多几分钟，不碍事。
name: relay-assets

on:
  schedule:
    # 每 6 小时一次：名单一天动一回，订阅节点也不常变，够了。
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 抓官方吊销名单
        run: |
          set -euo pipefail
          curl -sSfL --max-time 60 -o attestation-status.json \
            https://android.googleapis.com/attestation/status
          # 确认抓到的真是那份 JSON，别把错误页推到分支上
          python3 - <<'PY'
          import json
          with open("attestation-status.json") as f:
              data = json.load(f)
          entries = data.get("entries")
          assert isinstance(entries, dict) and entries, "entries 是空的"
          print(f"吊销名单 {len(entries)} 条")
          PY

      - name: 抓订阅、转格式、加密
        env:
          SUB_URL: ${{ secrets.CLASH_SUB_URL }}
          SUB_PASSPHRASE: ${{ secrets.SUB_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${SUB_URL:?仓库 secret CLASH_SUB_URL 没设，抓不了订阅}"
          : "${SUB_PASSPHRASE:?仓库 secret SUB_PASSPHRASE 没设，加不了密}"
          curl -sSfL --max-time 90 -A 'mihomo/1.19.31' -o sub.txt "$SUB_URL"
          node .github/scripts/sub_to_clash.js sub.txt > clash-subscription.yaml
          test -s clash-subscription.yaml
          head -3 clash-subscription.yaml
          # 加密参数要和服务器上那个解密命令一字不差（cipher / pbkdf2 / iter / md）
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -md sha256 -salt \
            -pass env:SUB_PASSPHRASE \
            -in clash-subscription.yaml -out clash-subscription.enc
          test -s clash-subscription.enc
          # 明文只在 runner 上待这一会儿，推之前删掉
          rm -f sub.txt clash-subscription.yaml
          echo "密文 $(wc -c < clash-subscription.enc) 字节"
          # 回头解一遍，确认密文和口令对得上（解出来落 /tmp，不进工作区）
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -md sha256 \
            -pass env:SUB_PASSPHRASE -in clash-subscription.enc -out /tmp/dec.yaml
          head -1 /tmp/dec.yaml
          rm -f /tmp/dec.yaml

      - name: 推到 relay-assets 分支
        run: |
          set -euo pipefail
          # 有意建成 orphan 分支：这里只给服务器兜这两个文件，不夹带整个仓库
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan relay-assets
          git rm -rq --cached .
          git add -f attestation-status.json clash-subscription.enc
          git commit -q -m "relay assets $(date -u +%F)"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            relay-assets
