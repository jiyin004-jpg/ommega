# 发版：编三端产物并挂到 GitHub Release 上。
#
# 产物一共五样：A 端 zip、B 端 zip、b-app 的 APK、服务端 Linux(musl) 二进制、
# 服务端 Windows 二进制。以前后两样得在自己电脑上单独编，现在一起在这儿出。
#
# 本地兜底 SOTER 的 ATTK 不再内置固定材料：build.py 每次构建现生成一把自签
# RSA（带生成时间），编进 injector；ASK 由运行时按 uid 现生成、落盘复用。
# 所以 CI 不需要任何 ASK secret，也不会把固定私钥发进包里。
#
# b-app 的签名还是得固定：debug.keystore 被 .gitignore 排除（里面有私钥），但从 secret
# `B_APP_KEYSTORE_B64` 还原，保证每次发出来的 APK 签名一致，能覆盖升级。
#
# 手动触发：
#   gh workflow run release.yml -f tag=v1.7.9
# 或 Actions 页面点 Run workflow。
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要挂产物的 release tag（必须已存在，比如 v1.7.9）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-side
            ws: a-side/source
          - name: b-side
            ws: b-side/source
    env:
      ANDROID_NDK_ROOT: /home/runner/android-ndk-r27d
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          # minimal profile 不含 Android target，要单独装；缺了会报
          # `can't find crate for core`。四个 ABI 全列上，缺的那个 build.py 也会补。
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: 装 protoc
        if: matrix.name == 'a-side'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends protobuf-compiler
          protoc --version

      - name: 取 NDK 缓存
        id: ndk
        uses: actions/cache@v4
        with:
          path: /home/runner/android-ndk-r27d
          key: android-ndk-r27d-linux

      - name: 下 NDK r27d
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 --max-time 900 -o /tmp/ndk.zip \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q /tmp/ndk.zip -d /home/runner
          rm -f /tmp/ndk.zip

      - name: 生成 .cargo/config.toml
        working-directory: ${{ matrix.ws }}
        run: python3 scripts/setup_cargo_config.py

      - name: 取 cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.ws }}/target
          key: cargo-rel-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.ws)) }}
          restore-keys: |
            cargo-rel-${{ runner.os }}-${{ matrix.name }}-

      - name: 打包
        working-directory: ${{ matrix.ws }}
        run: python3 build.py --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-zip
          path: ${{ matrix.ws }}/target/ommega-*-release-*.zip
          # A 端 zip 里有运行时材料，artifact 对登录用户可下，默认存 90 天，少留一份副本。
          retention-days: 1

  b-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # `yes | sdkmanager` 配上 `set -o pipefail` 会因为 yes 收到 SIGPIPE 而
      # 整条管道返回非零（日志里那句 `yes: standard output: Broken pipe`），
      # 把 `yes` 的退出码吃掉就行。许可在 runner 上本来就已经接受过。
      - name: 装 Android SDK 平台
        run: |
          set -uo pipefail
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "runner 上没有 $SDKM" >&2
            exit 1
          fi
          { yes 2>/dev/null || true; } | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: 取 gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('b-app/source/**/*.gradle*', 'b-app/source/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 签名密钥也走 secret：仓库里那份 debug.keystore 是被 .gitignore 挡住的。
      # 少了它 AGP 会打出未签名的包，装不上。
      - name: 还原签名密钥
        working-directory: b-app/source
        env:
          KEYSTORE_B64: ${{ secrets.B_APP_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "缺少 secret B_APP_KEYSTORE_B64（base64 后的 debug.keystore）" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > debug.keystore
          keytool -list -keystore debug.keystore -storepass android | tail -2

      - name: 编 APK
        working-directory: b-app/source
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: b-app-apk
          path: b-app/source/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-musl
            binary: relay_rs
          - os: windows-latest
            triple: ""
            binary: relay_rs.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 装工具链
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          if [ -n "${{ matrix.triple }}" ]; then
            rustup target add "${{ matrix.triple }}"
          fi

      - name: 装 musl 工具链
        if: matrix.triple != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools

      - name: 取 cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/source/target
          key: cargo-rel-${{ runner.os }}-server-${{ hashFiles('server/source/Cargo.lock') }}
          restore-keys: |
            cargo-rel-${{ runner.os }}-server-

      - name: 编服务端
        working-directory: server/source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.triple }}" ]; then
            cargo build --release --target "${{ matrix.triple }}"
          else
            cargo build --release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.binary }}
          path: server/source/target/${{ matrix.triple != '' && format('{0}/', matrix.triple) || '' }}release/${{ matrix.binary }}
          retention-days: 1

  publish:
    needs: [build, b-app, server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # 模块 zip 的默认文件名带构建时的短 hash（`-1.7.9-130bd97.zip`），而
      # `update.json` 的 zipUrl 是固定名字。这里统一去掉 hash 再上传，省得每次
      # 发完版还要手动改名、还得防着手抖留两份重复附件。
      - name: 统一附件名
        run: |
          set -euo pipefail
          for f in dist/a-side-zip/*.zip dist/b-side-zip/*.zip; do
            [ -f "$f" ] || continue
            out=$(basename "$f" | sed -E 's/-[0-9a-f]{7}\.zip$/.zip/')
            mv "$f" "dist/$out"
          done
          mv dist/b-app-apk/app-release.apk dist/client-b-app-release.apk
          find dist -maxdepth 1 -type f | sort

      # 用 gh 直接把附件挂到已有 release 上（同名附件会被替换）。
      # `GH_REPO` 必需：这个 job 没 checkout，gh 否则会去猜当前目录属于哪个仓库，
      # 报 `fatal: not a git repository`。
      - name: 上传到 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            dist/ommega-a-release-*.zip \
            dist/ommega-b-release-*.zip \
            dist/client-b-app-release.apk \
            dist/server-relay_rs/relay_rs \
            dist/server-relay_rs.exe/relay_rs.exe \
            --clobber
