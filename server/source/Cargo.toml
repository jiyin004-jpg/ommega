[package]
name = "relay_rs"
authors = ["jiyin004"]
version = "1.7.12"
edition = "2021"
description = "Rust port of the ommega relay_server (A/B relay protocol + server_keybox)"
license = "MIT"

[[bin]]
name = "relay_rs"
path = "src/main.rs"

[dependencies]
mimalloc = { version = "0.1", default-features = false }
axum = { version = "0.7", features = ["json", "query"] }
# `tls-rustls` would force rustls/aws-lc-rs; use the provider-agnostic variant
# so the ring-only rustls config above is honored.
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# No `minimal` feature: it forces flate2/zlib (libz-sys -> C zlib), which breaks
# the musl cross-build. flate2 is enabled below with the pure-Rust backend.
mysql = { version = "24", default-features = false }
rand = "0.8"
base64 = "0.22"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
yasna = "0.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
http = "1"
anyhow = "1"
# Pure-Rust crypto (no system OpenSSL needed)
p224 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8", "ecdh"] }
p384 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8", "ecdh"] }
p521 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
ecdsa = { version = "0.16", features = ["pem", "signing"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
x509-parser = "0.16"
pem = "3"
pkcs8 = { version = "0.10", features = ["pem"] }
digest = "0.10"
roxmltree = "0.20"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
md-5 = "0.10"
qrcode = "0.14"
# ring-only crypto provider: rustls's default provider is aws-lc-rs, whose
# C build (aws-lc-sys) does not cross-compile to musl. main.rs already installs
# the ring provider at runtime, so keep only ring here.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# mysql's compression uses flate2; give it the pure-Rust (miniz_oxide) backend so
# no C zlib (libz-sys) is linked in the musl cross-build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# 銆岃闀挎湡淇濈暀鐨勭姸鎬併€嶄笉鍐嶅悇鍐欏悇鐨?JSON锛岀粺涓€杩涗竴涓?SQLite 鏂囦欢锛堣 src/statedb.rs锛夈€?
# bundled 浼氭妸 SQLite 鐨?C 婧愮爜缂栬繘鏉ワ細musl 閭ｆ潯璧?cargo-zigbuild 鐨?zig cc銆?
# Android 閭ｆ潯璧?NDK 鐨?clang锛屼袱鏉′氦鍙夌紪璇戦兘瀹炴祴杩囷紝鎵€浠ヤ笉鐮磋繖涓枃浠朵竴鐩磋翰鐫€
# C 渚濊禆鐨勫簳绾匡紙韬茬殑鏄?aws-lc-sys / libz-sys 閭ｇ zig 涔熻垂鍔茬殑锛夈€?
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# 鏈湴鎻愪氦鍓嶉挬瀛愶紙閽╁瓙鑴氭湰鍦ㄤ粨搴撴牴鐨?.cargo-husky/hooks/锛夈€備笁绔兘澹版槑涓€浠斤紝
# 杩欐牱鍦ㄥ摢涓伐浣滃尯璺?cargo test 閮借兘鎶婇挬瀛愯涓娾€斺€旈挬瀛愪笉杩涚増鏈簱锛屽彧瑁呭埌 .git/hooks/銆?
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }

[profile.release]
opt-level = 2
