# `[filter].enabled = true` 时，UID 下任一包在作用域里就接管。
# 作用域只有一处来源：`/data/misc/keystore/ommega/target.txt`。

version = 1

[main]
enabled = true
log_level = "debug"

[filter]
enabled = true
deny_packages = []
block_android_package = true
allow_unknown_package = false
# 全局作用域：接管普通应用和 `system_sid_packages` 绑定的系统应用域；
# 其余 ROM 系统包和系统进程走系统后端。由面板写入。
global_scope = true

[intercept]
get_security_level = true
get_key_entry = true
update_subcomponent = true
list_entries = true
delete_key = true
grant = true
ungrant = true
get_number_of_entries = true
list_entries_batched = true
get_supplementary_attestation_info = true
