<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ommega</title>
<style>
  /* 自包含单文件：样式与脚本都内联，不依赖外部资源。管理器把 webroot/ 当静态目录
     serve 并注入 window.ksu。
     布局：顶栏（标题 + 关于）／状态条（keymint/keystore2/adbr/SOTER）／标签栏／
     四页内容。分页用 scroll-snap 做横向滑动，比手写 touch 事件稳。 */
  :root{
    --bg:#f5f6f8; --card:#fff; --fg:#1b1c1f; --dim:#6b6f76;
    --line:#e3e5e9; --accent:#3867d6; --ok:#1e9e5a; --bad:#d64545; --warn:#b8860b;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#141518;--card:#1e2024;--fg:#eceef2;--dim:#9aa0a8;--line:#2c2f35;--accent:#7aa2f7;--ok:#4ec97b;--bad:#f0736f;--warn:#e0b341;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;
       overflow:hidden;
       font:15px/1.6 -apple-system,"Noto Sans SC","Segoe UI",Roboto,sans-serif}
  /* 顶栏 */
  .topbar{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
  .tb-title{flex:1;font-size:18px;font-weight:600}
  .tb-title small{font-size:12px;font-weight:400;color:var(--dim);margin-left:8px}
  .tb-btn{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
      color:var(--fg);font-size:13px;font-family:inherit}
  /* 状态条 */
  .strip{display:flex;gap:6px;padding:0 14px 10px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;
      background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--dim)}
  .chip b{font-weight:500;color:var(--fg);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:#c9ccd2;flex:0 0 8px}
  .dot.on{background:var(--ok)} .dot.off{background:var(--bad)} .dot.warn{background:var(--warn)}
  /* 标签栏 */
  .tabs{display:flex;gap:4px;padding:0 14px 10px;position:relative}
  .tab-pill{position:absolute;left:0;top:0;border-radius:10px;background:var(--card);
      border:1px solid var(--line);pointer-events:none;will-change:transform;
      transition:transform .26s cubic-bezier(.22,.61,.36,1),width .26s cubic-bezier(.22,.61,.36,1)}
  .tabs.dragging .tab-pill{transition:none}
  .tab{flex:1;padding:8px 4px;border-radius:10px;border:1px solid transparent;background:transparent;
      position:relative;z-index:1;
      color:var(--dim);font-size:13px;font-family:inherit}
  .tab.on{background:transparent;border-color:transparent;color:var(--fg);font-weight:600}
  /* 分页 */
  .pages{flex:1;position:relative;overflow:hidden;min-width:0;touch-action:pan-y}
  /* 拖动和翻页动画期间把露出来的那几页留在合成层里，位移交给合成器。
     翻页动画结束后再撤掉，别让大页面一直占着层。 */
  .pages.dragging .page.on,
  .pages.settling .page.on{will-change:transform}
  .pages.dragging .page{transition:none}
  .page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 14px 28px;
      opacity:0;pointer-events:none;transform:translateX(12%);
      contain:layout paint;
      /* 只给 transform 做过渡：整页平移本来就能盖住旧页，再叠一层 opacity 透明混合
         等于让两张大图层每帧多算一遍混合，低端 GPU 上最容易掉帧。 */
      transition:transform .22s cubic-bezier(.22,.61,.36,1)}
  .page.on{opacity:1;pointer-events:auto;transform:translateX(0)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--dim)}
  .row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row .name{flex:1;min-width:0}
  .row .name b{display:block;font-weight:500;font-size:14px}
  .row .name small{display:block;color:var(--dim);font-size:12px;line-height:1.45}
  .row input[type=text],.row select{flex:0 0 46%;min-width:0;padding:7px 9px;border:1px solid var(--line);
      border-radius:8px;background:var(--bg);color:var(--fg);font-size:13px;font-family:inherit}
  /* 令牌 / 服务器地址这类长值：标签占一行、输入框占满下一行。
     原来 46%（约 144px）装不下 32 位 token，需要横向滚动 120px，聚焦全选时
     内容会整个跳到末尾，看着像「框变了」。 */
  .row.stacked{flex-wrap:wrap}
  .row.stacked .name{flex:0 0 100%}
  .row.stacked input[type=text]{flex:0 0 100%;margin-top:6px}
  .sw{position:relative;flex:0 0 46px;height:26px;border-radius:13px;background:#c9ccd2;
      cursor:pointer;transition:background .15s;border:0;padding:0}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
      background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw[aria-checked=true]{background:var(--accent)}
  .sw[aria-checked=true]::after{left:23px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
  button.btn{flex:1;min-width:96px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
      background:var(--card);color:var(--fg);font-size:14px;font-family:inherit}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.btn.sm{flex:0 0 auto;min-width:0;padding:6px 10px;font-size:13px;border-radius:8px}
  button.btn[disabled]{opacity:.5}
  .kv{display:flex;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
  .kv:first-of-type{border-top:0}
  .kv span:first-child{color:var(--dim);flex:0 0 104px}
  .kv span:last-child{flex:1;min-width:0;word-break:break-all;font-family:ui-monospace,monospace}
  /* 「当前」那种句子式的值不用等宽字体，让它正常换行、跟左边对齐 */
  .kv span.plain{font-family:inherit;word-break:break-word;line-height:1.5}
  .row button.btn{flex:0 0 84px;min-width:0;padding:8px 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hint{color:var(--dim);font-size:12px;line-height:1.5;margin:6px 0 0}
  /* 应用列表 */
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
  .search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
      background:var(--card);color:var(--fg);font-size:13px;font-family:inherit;margin-bottom:8px}
  #applist{background:var(--card);border:1px solid var(--line);border-radius:10px}
  /* 行高固定：列表按窗口渲染，靠这个常量算滚动位置；行里两行文字也钉死行高，
     免得系统字号/换行把高度撑变，窗口就对不上了。 */
  .app{display:flex;align-items:center;gap:10px;padding:7px 9px;border-top:1px solid var(--line);
      min-height:54px;overflow:hidden}
  .app:first-child{border-top:0}
  .app img{width:28px;height:28px;border-radius:6px;flex:0 0 28px;background:var(--line)}
  .app .meta{flex:1;min-width:0}
  .app .meta b{display:block;font-weight:500;font-size:13.5px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app .meta small{display:block;color:var(--dim);font-size:11.5px;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app select{flex:0 0 104px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;
      background:var(--bg);color:var(--fg);font-size:12.5px;font-family:inherit}
  .app.on{background:rgba(56,103,214,.07)}
  .app.off .meta,.app.off select{opacity:.45}
  /* 悬浮窗（关于 / 选文件） */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:flex;
      align-items:center;justify-content:center;padding:20px}
  .modal.hidden{display:none}
  .sheet{background:var(--card);border-radius:14px;width:100%;max-width:520px;max-height:84vh;
      display:flex;flex-direction:column;border:1px solid var(--line)}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .sheet-head b{flex:1;font-size:15px}
  .sheet-body{padding:12px 14px;overflow:auto}
  .sheet-foot{padding:10px 14px;border-top:1px solid var(--line)}
  /* 选文件 */
  .fp-bar{display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .fp-input{flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:12px;
      padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
  .fp-quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .fp-quick button.btn{flex:0 0 auto;max-width:100%;font-size:12px;overflow:hidden;
      text-overflow:ellipsis;white-space:nowrap}
  .fp-list{border:1px solid var(--line);border-radius:10px;max-height:44vh;overflow:auto}
  .fp-item{padding:8px 10px;font-size:13px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .fp-item:first-child{border-top:0}
  .fp-item.dir{font-weight:600}
  .fp-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(70px);
      background:#20232a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
      max-width:86vw;opacity:0;transition:.22s;pointer-events:none;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%)}
  #toast.err{background:#8d2b2b}
  #boot{color:var(--dim);font-size:13px;padding:8px 14px}
  /* 点按钮时浏览器会画一圈方框焦点框（有时还带点按高亮），手机上看很突兀 —— 去掉；
     输入框/下拉保留一圈柔和高亮，不然点进去看不出焦点在哪。 */
  button, .sw, .btn, .tb-btn { -webkit-tap-highlight-color: transparent; }
  button:focus, button:focus-visible, .sw:focus, .sw:focus-visible { outline: none; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .hidden{display:none}
  /* 可点的外跳项（QQ 群 / GitHub）：面板是个 WebView，里面的 <a> 跳不出去，统一走系统意图。 */
  .link{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-title">Ommega<small id="tb-ver"></small></div>
  <button class="tb-btn" id="about-btn" data-i18n="about.open"></button>
</div>

<div class="strip">
  <div class="chip"><i class="dot" id="dot-keymint"></i><b>keymint</b><span id="st-keymint"></span></div>
  <div class="chip"><i class="dot" id="dot-keystore"></i><b>keystore2</b><span id="st-keystore"></span></div>
  <div class="chip"><i class="dot" id="dot-adbr"></i><b>adbr</b><span id="st-adbr"></span></div>
  <div class="chip"><i class="dot" id="dot-soter"></i><b>SOTER</b><span id="st-soter"></span></div>
</div>

<div class="tabs" id="tabs">
  <span class="tab-pill" id="tabPill"></span>
  <button class="tab on" data-tab="0" data-i18n="tab.remote"></button>
  <button class="tab" data-tab="1" data-i18n="tab.scope"></button>
  <button class="tab" data-tab="2" data-i18n="tab.keys"></button>
  <button class="tab" data-tab="3" data-i18n="tab.patch"></button>
</div>

<div id="boot" data-i18n="boot"></div>

<div class="pages hidden" id="pages">

  <!-- ------------------------------- 1 远控 ------------------------------- -->
  <section class="page">
    <div class="card">
      <h2 data-i18n="remote.title"></h2>
      <div id="grp-remote"></div>
      <div class="acts">
        <button class="btn primary" id="save-remote" data-i18n="remote.save"></button>
        <button class="btn" id="open-status" data-i18n="status.open"></button>
      </div>
      <p class="hint" data-i18n="remote.hint"></p>
    </div>
  </section>

  <!-- ------------------------------ 2 作用域 ------------------------------ -->
  <section class="page">
    <div class="card">
      <h2 data-i18n="apps.title"></h2>
      <div class="kv"><span data-i18n="apps.count"></span><span id="app-count">-</span></div>
      <input type="text" id="app-search" class="search" data-i18n-ph="apps.search">
      <div class="toolbar">
        <button class="btn sm" id="app-reload" data-i18n="apps.refresh"></button>
        <button class="btn sm" id="toggle-system" data-i18n="apps.showSys"></button>
        <button class="btn sm" id="pick-all" data-i18n="apps.all"></button>
        <button class="btn sm" id="pick-none" data-i18n="apps.unall"></button>
      </div>
      <div id="applist"><p class="hint" id="applist-hint"></p></div>
      <div class="acts">
        <button class="btn primary" id="save-apps" data-i18n="apps.save"></button>
        <span class="hint" id="app-count2" style="align-self:center"></span>
      </div>
      <p class="hint" data-i18n="apps.list.hint"></p>
    </div>
  </section>

  <!-- ----------------------------- 3 本地密钥 ----------------------------- -->
  <section class="page">
    <div class="card">
      <h2 data-i18n="kb.title"></h2>
      <div class="row"><div class="name"><b data-i18n="kb.auto"></b><small data-i18n="kb.auto.hint"></small></div>
        <button class="btn sm" id="kb-auto" data-i18n="act.use"></button></div>
      <div class="row"><div class="name"><b data-i18n="kb.fromFile"></b><small data-i18n="kb.fromFile.hint"></small></div>
        <button class="btn sm" id="kb-file" data-i18n="act.use"></button></div>
      <div class="row"><div class="name"><b data-i18n="kb.self"></b><small data-i18n="kb.self.hint"></small></div>
        <button class="btn sm" id="kb-self" data-i18n="act.use"></button></div>
      <div class="row"><div class="name"><b data-i18n="kb.aosp"></b><small data-i18n="kb.aosp.hint"></small></div>
        <button class="btn sm" id="kb-aosp" data-i18n="act.use"></button></div>
      <div class="row"><div class="name"><b data-i18n="kb.yuri"></b><small data-i18n="kb.yuri.hint"></small></div>
        <button class="btn sm" id="kb-yuri" data-i18n="act.use"></button></div>
      <div class="row"><div class="name"><b data-i18n="kb.ommega"></b><small data-i18n="kb.ommega.hint"></small></div>
        <button class="btn sm" id="kb-ommega" data-i18n="act.use"></button></div>
      <div class="row"><div class="name"><b data-i18n="kb.rkp"></b><small data-i18n="kb.rkp.hint"></small></div>
        <button class="btn sm" id="rkp-fix" data-i18n="kb.rkp.btn"></button></div>
    </div>

    <!-- StrongBox 级别单独的一份 keybox（可选）；不配就沿用上面那份 -->
    <div class="card">
      <h2 data-i18n="sbkb.title"></h2>
      <div class="kv"><span data-i18n="sbkb.current"></span><span id="sbkb-state">-</span></div>
      <div class="row"><div class="name"><b data-i18n="sbkb.fromFile"></b><small data-i18n="sbkb.fromFile.hint"></small></div>
        <button class="btn sm" id="sbkb-file" data-i18n="act.use"></button></div>
      <div class="row"><div class="name"><b data-i18n="sbkb.clear"></b><small data-i18n="sbkb.clear.hint"></small></div>
        <button class="btn sm" id="sbkb-clear" data-i18n="act.clear"></button></div>
      <p class="hint" data-i18n="sbkb.hint"></p>
    </div>

    <div class="card">
      <h2 data-i18n="sk.title"></h2>
      <div class="kv"><span data-i18n="soter.record"></span><span id="soter-record">-</span></div>
      <div class="kv"><span data-i18n="sk.current"></span><span id="sk-state">-</span></div>
      <div class="row"><div class="name"><b data-i18n="sk.fromFile"></b><small data-i18n="sk.fromFile.hint"></small></div>
        <button class="btn sm" id="sk-file" data-i18n="act.use"></button></div>
      <div class="row"><div class="name"><b data-i18n="sk.clear"></b><small data-i18n="sk.clear.hint"></small></div>
        <button class="btn sm" id="sk-clear" data-i18n="act.clear"></button></div>
      <p class="hint" data-i18n="sk.hint"></p>
      <p class="hint" data-i18n="sk.format.hint"></p>
    </div>
  </section>

  <!-- ----------------------------- 4 伪装参数 ----------------------------- -->
  <section class="page">
    <div class="card">
      <h2 data-i18n="patch.title"></h2>
      <div id="grp-patch"></div>
      <p class="hint" data-i18n="patch.current"></p>
      <div id="patch-summary"></div>
      <div class="acts">
        <button class="btn primary" id="patch-sync" data-i18n="patch.sync"></button>
        <button class="btn sm" id="patch-edit" data-i18n="patch.manual"></button>
      </div>
      <p class="hint" data-i18n="patch.sync.hint"></p>
      <p class="hint" data-i18n="patch.store.hint"></p>
      <div id="patch-manual" class="hidden">
        <div class="row"><div class="name"><b data-i18n="patch.hash"></b><small data-i18n="patch.hash.hint"></small></div>
          <input type="text" id="boot-hash" autocapitalize="none"></div>
        <div class="row"><div class="name"><b data-i18n="patch.boot"></b><small data-i18n="patch.boot.hint"></small></div>
          <input type="text" id="patch-boot" autocapitalize="none" placeholder="2025-01-01"></div>
        <div class="row"><div class="name"><b data-i18n="patch.system"></b><small data-i18n="patch.system.hint"></small></div>
          <input type="text" id="patch-system" autocapitalize="none" placeholder="2025-01-01"></div>
        <div class="row"><div class="name"><b data-i18n="patch.vendor"></b><small data-i18n="patch.vendor.hint"></small></div>
          <input type="text" id="patch-vendor" autocapitalize="none" placeholder="2025-01-01"></div>
        <div id="patch-identity">
          <div class="row"><div class="name"><b data-i18n="patch.release"></b><small data-i18n="patch.release.hint"></small></div>
            <input type="text" id="ident-release" autocapitalize="none" placeholder="16"></div>
          <div class="row"><div class="name"><b data-i18n="patch.ident.brand"></b><small data-i18n="patch.ident.brand.hint"></small></div>
            <input type="text" id="ident-brand" autocapitalize="none"></div>
          <div class="row"><div class="name"><b data-i18n="patch.ident.device"></b><small data-i18n="patch.ident.device.hint"></small></div>
            <input type="text" id="ident-device" autocapitalize="none"></div>
          <div class="row"><div class="name"><b data-i18n="patch.ident.name"></b><small data-i18n="patch.ident.name.hint"></small></div>
            <input type="text" id="ident-name" autocapitalize="none"></div>
          <div class="row"><div class="name"><b data-i18n="patch.ident.manufacturer"></b><small data-i18n="patch.ident.manufacturer.hint"></small></div>
            <input type="text" id="ident-manufacturer" autocapitalize="none"></div>
          <div class="row"><div class="name"><b data-i18n="patch.model"></b><small data-i18n="patch.ident.model.hint"></small></div>
            <input type="text" id="ident-model" autocapitalize="none"></div>
          <div class="row"><div class="name"><b data-i18n="patch.fingerprint"></b><small data-i18n="patch.fingerprint.hint"></small></div>
            <input type="text" id="ident-fingerprint" autocapitalize="none"></div>
        </div>
        <div class="acts">
          <button class="btn primary" id="save-patch" data-i18n="patch.save"></button>
          <button class="btn sm" id="patch-clear" data-i18n="patch.clear"></button>
        </div>
        <p class="hint" data-i18n="patch.save.hint"></p>
      </div>
    </div>
  </section>
</div>

<!-- 关于（悬浮窗，可关闭） -->
<div class="modal hidden" id="about-modal">
  <div class="sheet">
    <div class="sheet-head"><b data-i18n="about.title"></b>
      <button class="tb-btn" id="about-close" data-i18n="common.close"></button></div>
    <div class="sheet-body">
      <div class="kv"><span data-i18n="about.version"></span><span id="about-ver">-</span></div>
      <div class="kv"><span data-i18n="about.lang"></span>
        <span><select id="lang" style="width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:13px;font-family:inherit"></select></span></div>
      <div class="kv"><span data-i18n="about.qq"></span><span class="link" data-open="mqqapi://card/show_pslcard?src_type=internal&amp;version=1&amp;uin=2167063739&amp;card_type=group" data-open-fallback="https://qm.qq.com/cgi-bin/qm/qr?group_code=2167063739">2167063739</span></div>
      <div class="kv"><span>GitHub</span><span class="link" data-open="https://github.com/jiyin004-jpg/ommega">jiyin004-jpg/ommega</span></div>
      <p class="hint" data-i18n="about.disclaimer"></p>
    </div>
  </div>
</div>

<!-- 选文件（悬浮窗，可关闭） -->
<div class="modal hidden" id="fp-modal">
  <div class="sheet">

function t(key, vars){

/* ---------------------------- 与设备交互（ksu） ---------------------------- */
function exec(cmd){
  return new Promise(function(resolve, reject){
    if (typeof ksu === "undefined" || typeof ksu.exec !== "function"){ reject(new Error(t("toast.noKsu"))); return; }
    var id = "oom_a_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    window[id] = function(errno, stdout, stderr){
      delete window[id];
      resolve({errno: errno, stdout: stdout || "", stderr: stderr || ""});
    };
    try { ksu.exec(cmd, "{}", id); }
    catch (e){ delete window[id]; reject(e); }
  });
}

function b64(text){

function parseKV(text, sep){

    var i = sep ? s.indexOf(":") : s.indexOf("=");

      var i = s.indexOf(":");
      if (i > 0){
        var k = s.slice(0, i).trim();
        if (managed.indexOf(k) >= 0){
          if (seen[k]) return;
          seen[k] = true;
          if (!(k in vals)){ if (!dropEmpty) out.push(line); return; }
          out.push(k + ": " + vals[k]);

/* ---------------------------- 分页（横向滑动） ---------------------------- */
/* 不用 CSS 的 scroll-snap：在安卓 WebView 上轻扫一下会被惯性带着连跳好几页，
   用户反馈「滑动一点能飘三里地」。改成下标 + 绝对定位的手写分页：拖动时当前页和
   相邻页跟着手指走，松手后一页一页吸附。 */
var activeTab = 0;
function pageEls(){ return document.querySelectorAll(".page"); }
function pageCount(){ return pageEls().length || 4; }

/* dx：拖动位移（px）；dragMode：拖动中（相邻页也要露出来）。
   每帧只动当前页和左右各一页，其余页的 transform/opacity/pointer-events 不动 ——
   以前一帧要给 4 个页面各写 4 个样式，还顺带在 pillFollow 里读 4 次 offset*，
   等于每帧强制一次同步布局，滑到应用列表那页就明显掉帧。 */
function layoutPages(dx, dragMode){
  var ps = pageEls();
  if (!ps.length) return;
  for (var k = 0; k < ps.length; k++){
    var rel = k - activeTab;
    var show = dragMode ? Math.abs(rel) <= 1 : rel === 0;
    var node = ps[k];
    if (node._show !== show){
      node._show = show;
      node.classList.toggle("on", show);
      node.style.opacity = show ? "1" : "0";
    }
    var pe = (rel === 0) ? "auto" : "none";
    if (node._pe !== pe){ node._pe = pe; node.style.pointerEvents = pe; }
    if (Math.abs(rel) > 1) continue;            /* 看不见的邻居不用每帧摆 */
    var tf = dx ? "translateX(calc(" + (rel * 100) + "% + " + dx + "px))"
                : "translateX(" + (rel * 100) + "%)";
    if (node._tf !== tf){ node._tf = tf; node.style.transform = tf; }
  }
}

function applyPage(i, animate){
  var ps = pageEls();
  if (!ps.length) return;
  var next = Math.max(0, Math.min(ps.length - 1, i));
  var host = document.getElementById("pages");
  /* 动画开始前还露着的页（拖动中的邻居页、上一页）先记下来，等动画走完再收。 */
  var keep = [];
  if (animate){
    for (var k = 0; k < ps.length; k++){
      if (k !== next && ps[k].classList.contains("on")) keep.push(ps[k]);
    }
  }
  if (host){
    host.classList.toggle("dragging", !animate);
    /* 翻页动画期间别急着撤合成层，动画结束（220ms）再撤；否则动画后半段又要重绘。 */
    if (animate){
      host.classList.add("settling");
      clearTimeout(applyPage._t);
      applyPage._t = setTimeout(function(){ host.classList.remove("settling"); }, 320);
    }
  }
  setActiveTab(next);
  activeTab = next;
  layoutPages(0, false);
  if (ps[next]) ps[next].style.zIndex = "2";   /* 新页盖在旧页上面滑进来 */
  /* 页面是整屏平移的，旧页要是一直留到滑出屏幕外再隐藏，否则它一消失就露出底色闪一下。
     （opacity 过渡去掉了，这里用定时器代替：动画走完再把非当前页统一收起来。） */
  if (animate && keep.length){
    keep.forEach(function(node){
      node.classList.add("on");
      node.style.opacity = "1";
      node.style.zIndex = "1";
      node._show = true;
    });
    clearTimeout(applyPage._o);
    applyPage._o = setTimeout(function(){
      if (host && host.classList.contains("dragging")) return;   /* 又开始拖了，交给拖动流程 */
      pageEls().forEach(function(node, idx){
        if (idx === activeTab || !node.classList.contains("on")) return;
        node.classList.remove("on");
        node.style.opacity = "0";
        node.style.zIndex = "";
        node._show = false;
      });
    }, 240);
  }
  pillTo(next, animate);
}

function gotoPage(i){ applyPage(i, true); }
/* 顶部那块高亮做成一根单独的元素，切页 / 拖动时跟着位移，而不是直接跳过去。
   标签的几何值只在布局真的变了（切语言、转屏、字体大小）时量一次，拖动中直接用缓存：
   以前每帧都读 offsetLeft/offsetWidth/offsetTop/offsetHeight，这几下读会强制同步布局。 */
var TAB_RECTS = null;
function measureTabs(){
  var tb = document.querySelectorAll(".tab");
  TAB_RECTS = [];
  for (var i = 0; i < tb.length; i++){
    TAB_RECTS.push({x: tb[i].offsetLeft, w: tb[i].offsetWidth, y: tb[i].offsetTop, h: tb[i].offsetHeight});
  }

function tabRect(i){

function movePill(x, w, y, h, animate){
  var p = document.getElementById("tabPill");
  if (!p) return;
  var tabs = document.getElementById("tabs");
  if (tabs) tabs.classList.toggle("dragging", !animate);
  if (w && p._w !== w){ p._w = w; p.style.width = w + "px"; }
  if (h && p._h !== h){ p._h = h; p.style.height = h + "px"; }
  if ((y || y === 0) && p._y !== y){ p._y = y; p.style.top = y + "px"; }
  if (p._x !== x){ p._x = x; p.style.transform = "translate3d(" + x + "px,0,0)"; }

/* frac：拖动位移占一页的比例，-1..1；高亮块按这个比例插到相邻那个标签上。

function pillFollow(frac){

/* 切语言（或系统字体大小变化）之后，标签文字的行数、宽度都会变，页面内容也会重排。

   于是会出现「上面的高亮/位置和文字对不上，手动滑一下才恢复」。
   这里在下一帧把当前页重新摆一遍，等于替用户滑了那一下。 */
function relayoutActivePage(){
  var ps = pageEls();
  if (!ps.length) return;
  var host = document.getElementById("pages");
  if (host && host.classList.contains("dragging")) return;   /* 正在拖动就别插手 */
  TAB_RECTS = null;                                          /* 尺寸可能变了，下次重新量 */

function relayoutSoon(){

     切语言后文字重排，合成层有时还留着旧位图，表现就是「内容整体偏了一点，滑一下才回来」。 */
  layoutPages(1, false);
  requestAnimationFrame(function(){
    if (host && host.classList.contains("dragging")) return;
    layoutPages(0, false);
    pillTo(activeTab, true);
  });

  setTimeout(relayoutActivePage, 220);

function wireTabs(){

  function settleDrag(){
    if (idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    stopFrame();
    x0 = null; dx = 0; raw = 0; axis = 0; samples = [];
    pages.classList.remove("dragging");
    applyPage(activeTab, true);
  }
  pages.addEventListener("touchstart", function(e){
    if (e.touches.length !== 1) return;
    if (idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; raw = 0; axis = 0;
    pageW = pages.clientWidth || 1;
    lastPage = pageCount() - 1;
    samples = [{t: Date.now(), x: 0}];
  }, {passive: true});
  pages.addEventListener("touchmove", function(e){
    if (x0 === null || e.touches.length !== 1) return;
    var nx = e.touches[0].clientX - x0;
    var ny = e.touches[0].clientY - y0;
    if (!axis){
      if (Math.abs(nx) < 8 && Math.abs(ny) < 8) return;
      axis = Math.abs(nx) > Math.abs(ny) ? 1 : 2;
      if (axis === 2){ x0 = null; return; }
      /* 确定是横向滑动才关过渡、提合成层；纵向滚页面时完全不动这些。 */
      pages.classList.remove("settling");
      pages.classList.add("dragging");
    }
    raw = nx;
    var now = Date.now();
    samples.push({t: now, x: raw});
    while (samples.length > 2 && now - samples[0].t > 220) samples.shift();
    dx = nx;
    /* 到头的方向阻尼一下，避免拉出去一屏空白 */
    if ((activeTab === 0 && dx > 0) || (activeTab === lastPage && dx < 0)) dx = dx / 3;
    queueDrag();
    armIdle();
    if (e.cancelable) e.preventDefault();
  }, {passive: false});
  function endDrag(e){
    if (idleTimer){ clearTimeout(idleTimer); idleTimer = null; }
    if (x0 === null) return;
    /* 松手那一瞬的位置也算进来，不然最后一下的位移和速度会漏掉 */
    if (e && e.changedTouches && e.changedTouches.length){
      raw = e.changedTouches[0].clientX - x0;
      samples.push({t: Date.now(), x: raw});
    }
    var w = pages.clientWidth || 1;
    var now = Date.now();
    /* 取 90ms 往前的那个采样点算平均速度（px/ms，正数=往右滑），太近的点抖动大 */
    var ref = samples.length ? samples[0] : {t: now, x: raw};
    for (var i = samples.length - 1; i >= 0; i--){
      if (now - samples[i].t >= 90){ ref = samples[i]; break; }
    }
    var dt = Math.max(16, now - ref.t);
    var v = (raw - ref.x) / dt;
    var th = Math.max(40, w / 6);       /* 慢拖的阈值 */
    var flick = Math.max(20, w / 16);   /* 快甩的最小位移 */
    var next = activeTab;
    if (dx <= -th || (v <= -0.18 && raw <= -flick)) next = activeTab + 1;
    else if (dx >= th || (v >= 0.18 && raw >= flick)) next = activeTab - 1;
    /* 把还没画出去的那一帧补上，翻页动画才能从手指松开时的真实位置接着走。 */
    if (frame){ cancelAnimationFrame(frame); frame = 0; layoutPages(dx, true); }
    pages.classList.remove("dragging");
    x0 = null; dx = 0; raw = 0; axis = 0; samples = [];
    applyPage(next, true);
  }
  pages.addEventListener("touchend", endDrag, {passive: true});
  pages.addEventListener("touchcancel", endDrag, {passive: true});
}
function setActiveTab(i){

  activeTab = i;
  TAB_RECTS = null;                 // 加粗态换了标签，宽度/行高可能变，下次重新量
  document.querySelectorAll(".tab").forEach(function(tb, idx){

  });

/* 一行应用。抽出来是为了窗口渲染时能按需建/删，不用每次都重写一遍字段。 */
function appRowEl(a){

    .forEach(function(pair){

/* 按滚动位置算「该渲染哪一段」。visStart/visEnd 是视口里的行，start/end 多带一圈缓冲。 */
function appWindowRange(){
  var page = pageEls()[1];
  var box = document.getElementById("applist");
  var total = appShown.length;
  var r = {start: 0, end: total, visStart: 0, visEnd: total};
  if (!page || !box || !total) return r;
  var h = page.clientHeight || 600;
  var top = page.scrollTop - box.offsetTop;   /* 列表顶部相对滚动视口的位置 */
  if (top < 0) top = 0;
  r.visStart = Math.min(total, Math.floor(top / APP_ROW_H));
  r.visEnd = Math.min(total, Math.ceil((top + h) / APP_ROW_H));
  r.start = Math.max(0, r.visStart - APP_OVERSCAN);
  r.end = Math.min(total, r.visEnd + APP_OVERSCAN);
  return r;
}
function paintAppsWindow(force){
  var box = document.getElementById("applist");
  if (!box) return;
  var total = appShown.length;
  if (!total){
    appWinStart = appWinEnd = -1;
    /* 正在重载时列表是空的，但提示得留着「载入中」，别被换成「列表为空」。 */
    if (appHint && appHint.key === "apps.loading") return;
    appHint = appRows.length ? {key: "apps.empty"} : {key: "toast.appsFail", vars: {msg: "-"}};
    paintAppHint();
    return;
  }
  appHint = null;
  /* 整个列表都已经在 DOM 里（小列表），怎么滚都不用重建。 */
  if (!force && appWinStart === 0 && appWinEnd >= total) return;
  var r = appWindowRange();
  /* 视口还稳稳落在已渲染区间的中间时不动 DOM，只有快露出边界才重建。 */
  if (!force && appWinStart >= 0 &&
      r.visStart >= appWinStart + 2 && r.visEnd <= appWinEnd - 2) return;
  appWinStart = r.start; appWinEnd = r.end;
  var frag = document.createDocumentFragment();
  if (r.start > 0){
    var padA = el("div", "pad");
    padA.style.height = (r.start * APP_ROW_H) + "px";
    frag.appendChild(padA);
  }
  for (var i = r.start; i < r.end; i++) frag.appendChild(appRowEl(appShown[i]));
  if (r.end < total){
    var padB = el("div", "pad");
    padB.style.height = ((total - r.end) * APP_ROW_H) + "px";
    frag.appendChild(padB);
  }
  box.innerHTML = "";
  box.appendChild(frag);
  /* 行高按实际量到的修正一次：系统字号设得大时文字会把行撑高，估值就对不上滚动位置了。 */
  if (force){
    var probe = box.querySelector(".app");
    var real = probe ? probe.offsetHeight : 0;
    if (real > 0 && Math.abs(real - APP_ROW_H) > 0.5){
      APP_ROW_H = real;
      paintAppsWindow(true);
    }
  }
}
function renderApps(){
  var box = document.getElementById("applist");

  appShown = visibleApps();
  appWinStart = appWinEnd = -1;

var __pkgCache = null, __pkgAt = 0;
function loadPackages(){
  // 整页最慢的一步就是这里：`pm list packages` 在这类机器上单条就要几百毫秒
  // 到两秒。所以做两件事：①包列表 60 秒内不重复拉（几十秒内基本不会变，每次
  // 进页面都重拉是纯浪费）；②两条 pm 并行跑（各自落临时文件再一起 cat），别
  // 串行等。
  var now = Date.now();
  if (__pkgCache && (now - __pkgAt) < 60000) return Promise.resolve(__pkgCache);
  var script = "A=/data/local/tmp/.ommega_pkg3; B=/data/local/tmp/.ommega_pkgs; "
    + "pm list packages -3 2>/dev/null | sed 's/^package://' > $A & "
    + "pm list packages -s 2>/dev/null | sed 's/^package://' > $B & wait; "
    + "cat $A; echo '---'; cat $B; rm -f $A $B";
  return exec(script)
    .then(function(r){
      var parts = r.stdout.split("---");
      var user = (parts[0] || "").split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
      var sys = (parts[1] || "").split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
      var sysSet = {};
      sys.forEach(function(p){ sysSet[p] = true; });
      var result = {all: user.concat(sys), system: sysSet};
      __pkgCache = result;
      __pkgAt = Date.now();
      return result;
    });
}
function loadLabels(pkgs){
  return new Promise(function(resolve){
    if (typeof ksu === "undefined" || typeof ksu.getPackagesInfo !== "function") return resolve({});
    try {
      var list = JSON.parse(ksu.getPackagesInfo(JSON.stringify(pkgs)) || "[]");
      var map = {};
      list.forEach(function(it){ var p = it.packageName || it.package; if (p) map[p] = it.appLabel || it.label || ""; });
      resolve(map);
    } catch (e){ resolve({}); }
  });
}
async function reloadAppFiles(){
  var r = await exec("cat " + TARGET + " 2>/dev/null; echo '---S---'; cat " + SYSTEMAPP + " 2>/dev/null");
  var parts = r.stdout.split("---S---");
  var gen = [], hack = [], norm = [];
  (parts[0] || "").split("\n").forEach(function(line){
    var s = line.trim();
    if (!s) return;
    if (/!$/.test(s)) gen.push(s.slice(0, -1));
    else if (/\?$/.test(s)) hack.push(s.slice(0, -1));
    else norm.push(s);
  });
  /* target.txt 根本不存在（面板从没保存过作用域）时，真正生效的是 injector.toml
     里那份 scoop 默认值。这时候把默认值勾上，面板显示的范围才是实际被接管的范围；
     文件空着（打开保存但一个都没勾）就是真的一个都不接管，不能拿默认值顶上。 */
  if (!norm.length && !gen.length && !hack.length && !(await targetExists())) {
    norm = await defaultScopePackages();
  }
  var sysSet = {};
  (parts[1] || "").split("\n").forEach(function(line){ var s = line.trim(); if (s) sysSet[s] = true; });
  curTarget = {normal: norm, generate: gen, hack: hack};
  return sysSet;
}
/* 作用域文件在不在：决定「没勾」到底是没配过、还是配成了空的。 */
async function targetExists(){
  var r = await exec("test -f " + TARGET + " && echo yes");

}
/* injector.toml 里的 scoop 默认值（跟模块自带配置同一个源）。 */
async function defaultScopePackages(){
  var r = await exec("sed -n '/^scoop/,/^]/p' " + MODDIR + "/injector.toml 2>/dev/null");
  var out = [];
  (r.stdout || "").split("\n").forEach(function(line){
    var m = line.match(/"([A-Za-z0-9_.]+)"/);
    if (m && out.indexOf(m[1]) < 0) out.push(m[1]);
  });
  return out;
}
async function loadApps(){
  document.getElementById("applist").innerHTML = '<p class="hint">' + t("apps.loading") + "</p>";
  appHint = {key: "apps.loading", vars: null};
  appShown = [];                       /* 载入期间别让滚动事件拿旧数据重建列表 */
  appWinStart = appWinEnd = -1;

  catch (e){ toast(t("toast.appsFail", {msg: e.message}), true); return; }
  var listed = {};
  curTarget.normal.concat(curTarget.generate, curTarget.hack).forEach(function(p){ listed[p] = true; });
  Object.keys(sysSet).forEach(function(p){ listed[p] = true; });
  var all = pkgs.all.filter(function(v, i, a){ return a.indexOf(v) === i; });
  Object.keys(listed).forEach(function(p){ if (all.indexOf(p) < 0) all.push(p); });
  var labels = await loadLabels(all.slice(0, 400));
  var canIcon = (typeof ksu !== "undefined" && ksu && typeof ksu.getPackagesInfo === "function");
  appRows = all.map(function(p){
    return { pkg: p, label: labels[p] || "", icon: canIcon ? ("ksu://icon/" + p) : "",
             mode: modeOf(p), checked: !!listed[p], system: !!sysSet[p] || !!pkgs.system[p] };
  });
  renderApps();
}

/* --------------------------------- 状态 --------------------------------- */
/* 状态条：pidof 三件套（很快）+ SOTER。
   SOTER 先看**本机记录**（/data/misc/ommega/soter_ok）：只要本机出过任何一笔成功的
   签名（远程真机 TEE / 本地自签 / 服务器自签都算），那里就有一行 —— 这是加载立刻
   就有结论的那一条，不用等新调用。本机没记录才退回看跟随设备上报的能力。 */
var soterState = "unknown";
var soterRecord = null;
/* soter_attk.pem 是否存在。缓存成布尔值，切语言时直接拿它重绘「目前」那一行，
   不必再跑一次 shell；refreshAttk 每次读完文件都会同步它。 */
var attkCustom = false;

async function readSoterRecord(){
  var r = await exec("tail -n 1 /data/misc/ommega/soter_ok 2>/dev/null");
  soterRecord = null;
  var line = (r.stdout || "").trim();
  if (!line) return;
  var p = line.split("\t");
  var epoch = parseInt(p[0], 10);
  if (!isFinite(epoch) || epoch <= 0) return;
  soterRecord = { epoch: epoch, op: p[1] || "", uid: p[2] || "", alias: p[3] || "" };
}
function paintSoterRecord(){
  var e = document.getElementById("soter-record");
  if (!e) return;
  if (!soterRecord){ setT(e, "soter.record.none"); return; }
  var d = new Date(soterRecord.epoch * 1000);
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  var when = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
             " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  /* 变量里放原样 op（selftest），显示文本由 paintT 按当前语言翻，切语言才跟得上。 */
  setT(e, "soter.record.last", {time: when, op: soterRecord.op});
}

async function refreshStatus(){
  var r = await exec("pidof keymint 2>/dev/null; echo '---'; pidof keystore2 2>/dev/null; echo '---'; pidof adbrd 2>/dev/null");
  var p = r.stdout.split("---");
  function first(s){ s = (s || "").trim(); return s ? s.split(/\s+/)[0] : ""; }
  [["keymint", first(p[0])], ["keystore", first(p[1])], ["adbr", first(p[2])]].forEach(function(pair){
    var on = !!pair[1];

function paintSoter(){

  else if (soterState === "ok"){ cls = "dot on"; key = "soter.ok"; }
  else if (soterState === "nosign"){ cls = "dot warn"; key = "soter.nosign"; }
  else if (soterState === "stuck"){ cls = "dot off"; key = "soter.stuck"; }
  else if (soterState === "off"){ cls = "dot off"; key = "soter.off"; }

/* 顺带把 /api/status/ 拉一次：本机没记录时才用它。 */
async function refreshSoter(){
  await readSoterRecord();
  paintSoterRecord();
  if (soterRecord){ soterState = "local"; paintSoter(); return; }
  var id = fieldVal("device_id", "");
  if (!id){ soterState = "unknown"; paintSoter(); return; }
  try {
    var data = await fetchStatus();
    var hit = null, list = (data && (data.online_b_devices || data.connected)) || [];
    for (var i = 0; i < list.length; i++){ if (list[i] && list[i].device_id === id){ hit = list[i]; break; } }
    if (!hit){ soterState = "unknown"; }
    else if (hit.soter_stuck){ soterState = "stuck"; }

/* 面板要 GET 一小段文本（状态接口、同步 B 端等）。设备上不一定有 curl：有的 ROM
   只带 toybox，没有 curl applet（NX809J 实测），而 KernelSU / Magisk / APatch 都自带
   busybox，`wget` 一定有。所以挨个试，并把成功那一个记下来下次直接用。 */
var HTTP_TOOL = null;
async function httpGetText(url, budget){
  var u = String(url).replace(/'/g, "'\\''");
  var per = Math.max(2, Math.min(budget || 4, 6));
  var tries = [
    ["curl", "curl -s --connect-timeout 2 --max-time 3 '" + u + "' 2>/dev/null"],
    ["bb-ksu", "'/data/adb/ksu/bin/busybox' wget -q -T 3 -O - '" + u + "' 2>/dev/null"],
    ["bb-magisk", "'/data/adb/magisk/busybox' wget -q -T 3 -O - '" + u + "' 2>/dev/null"],
    ["bb-ap", "'/data/adb/ap/bin/busybox' wget -q -T 3 -O - '" + u + "' 2>/dev/null"],
    ["bb", "busybox wget -q -T 3 -O - '" + u + "' 2>/dev/null"],
    ["wget", "wget -q -T 3 -O - '" + u + "' 2>/dev/null"]
  ];
  if (HTTP_TOOL){
    var known = tries.filter(function(x){ return x[0] === HTTP_TOOL; })[0];
    if (known) tries = [known];
  }
  for (var i = 0; i < tries.length; i++){
    var r = await exec("timeout " + per + " " + tries[i][1]);
    if (r.errno === 0 && (r.stdout || "").trim()){ HTTP_TOOL = tries[i][0]; return r.stdout; }
  }
  throw new Error("unreachable");
}
async function fetchStatus(){
  var base = serverBase();

  /* 套一层硬超时：信号差或服务器不答时请求能挂很久，面板就跟着一直转。 */
  var out;
  try { out = await httpGetText(base + "/api/status/", 6); }
  catch (e){ throw new Error(t("toast.noNet")); }

}

async function writeKeybox(xml, src){
  if (!xml || xml.indexOf("<AndroidAttestation") < 0){ toast(t("toast.kbBad"), true); return; }
  await exec("cp -f " + KEYBOX + " " + KEYBOX + ".bak 2>/dev/null");

/* 拿到的东西可能不是裸 XML：服务器那个公开库、yurikey 都是 base64 的（Rust 侧
   autokeybox.rs 一直认 base64/hex，面板这边早先没认，于是那两路永远判无效）。 */
function normalizeKeybox(text){
  var t = String(text || "").trim();
  if (!t) return "";
  if (t.indexOf("<AndroidAttestation") >= 0 || t.indexOf("<Keybox") >= 0) return t;
  try {
    var dec = atob(t.replace(/\s+/g, ""));
    if (dec.indexOf("<AndroidAttestation") >= 0 || dec.indexOf("<Keybox") >= 0) return dec;
  } catch (e){}
  return t;
}
/* 抓 keybox。整条链子（curl 一遍 + busybox wget 一遍，逐个 url）套一个硬超时，
   默认 6 秒——不然「自动获取」在没网/慢网的机器上会挂到几十秒，看着就是卡死。 */
async function tryFetchKeybox(urls, budget){
  var cmd = urls.map(function(u){ return "curl --connect-timeout 2 --max-time 3 -sL '" + u + "' 2>/dev/null"; })
    .concat(urls.map(function(u){ return "busybox wget -T 3 --no-check-certificate -qO- '" + u + "' 2>/dev/null"; }))
    .join(" || ");
  var r = await exec("timeout " + (budget || 6) + " sh -c \"" + cmd + "\"");
  if (r.errno !== 0 || !r.stdout.trim()) return null;
  var xml = normalizeKeybox(r.stdout);
  if (xml.indexOf("<AndroidAttestation") < 0) return null;
  return xml;
}
async function fetchKeybox(urls, src){
  var xml = await tryFetchKeybox(urls);
  if (!xml){ toast(t("toast.kbFetchFail"), true); return; }
  await writeKeybox(xml, src);
}

/* 两个能力开关（StrongBox / 设备 ID 认证）都只落到模块自己的一份声明 XML：
   /data/adb/modules/ommega/system/etc/permissions/ommega-capability-mask.xml
   里面写 <unavailable-feature name="..." />，SystemConfig 读完所有权限 XML 后会把同名
   feature 从可用表删掉，于是 PackageManager、feature 枚举、以及进程里的
   SystemFeaturesCache 拿到的是同一份「本机没有这个能力」。
   为什么不种 whiteout / 不 bind 厂商那份 XML：那两条都要动真实分区的文件，整份文件被清掉
   会连带同文件里的 app_attest_key 一起消失；万一内容不合法（暂存文件复用踩过一次），
   system_server 解析 /odm/etc/permissions 失败，设备直接开不了机。
   XML 必须赶在 system_server 之前就位，所以保存时先写一遍，重启后由 post-fs-data 再对齐一次。 */
async function syncCapabilityMask(sb, ids){
  var dir = MODDIR + "/system/etc/permissions";
  var f = dir + "/ommega-capability-mask.xml";
  var lines = ['<?xml version="1.0" encoding="utf-8"?>', '<permissions>'];
  if (sb) lines.push('  <unavailable-feature name="android.hardware.strongbox_keystore" />');
  if (ids) lines.push('  <unavailable-feature name="android.software.device_id_attestation" />');
  lines.push('</permissions>');
  var args = lines.map(function(s){ return "'" + s.replace(/'/g, "'\\''") + "'"; });
  var cmd = 'mkdir -p ' + dir + ' && printf \'%s\\n\' ' + args.join(" ") +
            ' > ' + f + '.new && mv -f ' + f + '.new ' + f + ' && chmod 644 ' + f;
  var r = await exec(cmd);
  return Number(r.errno) === 0;
}

function patchDate(v){
  if (v === null || v === undefined || v === "") return "";
  var s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  if (/^\d{6}$/.test(s)) return s.slice(0, 4) + "-" + s.slice(4, 6) + "-01";
  if (/^\d{8}$/.test(s)) return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8);
  return s;
}
function androidMajor(v){
  var n = Number(v);
  if (!isFinite(n) || n <= 0) return "";
  return n >= 10000 ? String(Math.floor(n / 10000)) : String(n);
}
/* 「留空自己获取」时的挑法：先挑硬件条件合格的（有启动信息、已锁定、Verified、没 TEE 自检
   失败），再按版本挑：同大版本（major.minor 一样）优先；没有就从最近的上下范围里选更高的，
   再选更低的，范围不够就往外扩（同一个距离上高的优先）。同一档里按负载从低到高。 */
function verNums(v){
  var m = String(v || "").match(/^(\d+)\.(\d+)(?:\.(\d+))?/);
  return m ? [Number(m[1]), Number(m[2]), Number(m[3] || 0)] : null;
}
function verRank(d, mine){
  if (!mine) return [3, 0, 0];
  var v = verNums(d && d.version);
  if (!v) return [3, 0, 0];
  if (v[0] === mine[0] && v[1] === mine[1]) return [0, 0, 0];
  var diff = (v[0] - mine[0]) * 100 + (v[1] - mine[1]);
  return [1, Math.abs(diff), diff > 0 ? 0 : 1];
}
/* boot 补丁：归一成 8 位日期（"2026-08-01" / "20260801" / "202608" 都收）。 */
function bootNums(v){
  var s = String(v || "").trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return Number(s.replace(/-/g, ""));
  if (/^\d{8}$/.test(s)) return Number(s);
  if (/^\d{6}$/.test(s)) return Number(s) * 100 + 1;
  return null;
}
/* 跟当前设备的 boot 补丁比：同一年优先 → 日期不小于当前（日期大的）优先 → 离当前越近优先。
   当前没有值时这条整条不参与（返回全 0），不影响原来的挑法。 */
function bootRank(d, cur){
  if (!cur) return [0, 0, 0];
  var v = bootNums(d && d.boot && d.boot.patch_boot);
  if (!v) return [2, 0, 0];
  var sameYear = Math.floor(v / 10000) === Math.floor(cur / 10000) ? 0 : 1;
  var notOlder = v >= cur ? 0 : 1;
  return [sameYear, notOlder, Math.abs(v - cur)];
}
/* os/vendor 这两项跟当前设备差多远：同年 0、差一年 1、更远 2；缺值不参与（算 0）。 */
function nearRank(x, cur){
  var a = bootNums(x), c = bootNums(cur);
  if (!a || !c) return 0;
  var ya = Math.floor(a / 10000), yc = Math.floor(c / 10000);
  if (ya === yc) return 0;
  return Math.abs(ya - yc) === 1 ? 1 : 2;
}
/* 其他两个补丁（os/vendor）离本机多近，越小越好。 */
function patchRank(d){
  var b = (d && d.boot) || {};
  return nearRank(b.patch_system, A_PATCH.os) + nearRank(b.patch_vendor, A_PATCH.vendor);
}
function pickBestDevice(list, curBoot){
  var ok = [];
  for (var i = 0; i < list.length; i++){
    var d = list[i];
    if (!d || !d.boot || d.tee_error) continue;
    if (d.module === false) continue;   /* 手机 App（org.ommega.deviceb）那种 B 端不参与 */
    if (d.boot.device_locked !== true) continue;
    if (Number(d.boot.verified_boot_state) !== 0) continue;
    ok.push(d);
  }
  if (!ok.length) return null;
  var mine = verNums(A_VER), cur = bootNums(curBoot);
  ok.sort(function(a, b){
    var ba = bootRank(a, cur), bb = bootRank(b, cur);
    if (ba[0] !== bb[0]) return ba[0] - bb[0];   /* 1 boot 是不是同一年 */
    var ra = verRank(a, mine), rb = verRank(b, mine);
    for (var k = 0; k < 3; k++){ if (ra[k] !== rb[k]) return ra[k] - rb[k]; }   /* 2 版本 */
    var pa = patchRank(a), pb = patchRank(b);
    if (pa !== pb) return pa - pb;               /* 3 os/vendor 两个补丁相近 */
    if (ba[1] !== bb[1]) return ba[1] - bb[1];   /* 4 boot 日期不小的优先（同范围内大的） */
    if (ba[2] !== bb[2]) return ba[2] - bb[2];   /* 5 boot 离当前最近 */
    return (Number(a.load) || 0) - (Number(b.load) || 0);   /* 6 负载 */
  });
  return ok[0];
}

  var name = (hit.machine_id || hit.device_id) + (major ? " (Android " + major + ")" : "") + (hit.version ? " · v" + hit.version : "");
  LAST_PICK = {boot: b, identity: hit.identity || {}, name: name};
  toast(auto ? t("toast.pickedAuto", {name: name}) : t("toast.picked", {name: name}));
  return true;
}
/* props.conf 里当前已有的那些项（只认我们管的键） */
function currentPropsKV(){
  var kv = {};
  (curPropsText || "").split("\n").forEach(function(line){
    var m = /^([A-Za-z0-9_.]+)\s*:\s*(.*)$/.exec(line.trim());
    if (m && PROP_KEYS.indexOf(m[1]) >= 0) kv[m[1]] = m[2].trim();
  });
  return kv;
}
/* 把 kv 写回 props.conf：模式1 管全集，模式2 把身份那几行直接去掉（daemon 那边就又能
   按链里带的身份自己对齐了）；当前模式用不到的值一律不写 ——— 空值 = 不覆盖。 */
async function writePropsKV(kv){
  var text = dropKeys(mergeKV(curPropsText, kv, PROP_KEYS, true), RETIRED_KEYS);
  if (!curPropsText.trim()){
    text = "# 开机时统一应用的系统属性覆盖（面板「伪装参数」写的就是这里）。\n" +
           "# 一行一项，格式 `键: 值`；# 开头是注释；空值 = 不覆盖（由模块自己的默认值决定）。\n" +
           "# 为什么不写在 post-fs-data.sh 里：模块升级会把那个脚本整个换掉，写进去的设置会丢。\n" + text;
  }
  var r = await writeFile(PROPS, text, "0644");
  if (r.errno !== 0){ toast(t("toast.saveFail", {msg: r.stderr || r.errno}), true); return false; }
  curPropsText = text;
  aDirty = false;
  return true;
}
async function syncPatch(){
  if (!(await fetchDeviceBoot())) return;
  var pick = LAST_PICK || {}, b = pick.boot || {};
  var kv = currentPropsKV();
  var hash = String(b.boot_hash || "").toLowerCase();
  if (/^[0-9a-f]{64}$/.test(hash)) kv["ro.boot.vbmeta.digest"] = hash;
  var bootPatch = patchDate(b.patch_boot);
  if (bootPatch) kv["ro.boot.build.security_patch"] = bootPatch;
  if (!(await writePropsKV(kv))) return;
  await saveRemote();
  /* 只当场该那两项：重启前 zygote 里的 Build 已经固化，身份那几项只能等下次开机。 */
  var now = {};
  if (kv["ro.boot.build.security_patch"]) now["ro.boot.build.security_patch"] = kv["ro.boot.build.security_patch"];
  if (kv["ro.boot.vbmeta.digest"]) now["ro.boot.vbmeta.digest"] = kv["ro.boot.vbmeta.digest"];
  var keys = Object.keys(now);
  if (keys.length){
    await exec(keys.map(function(k){
      return '(R=' + RESETPROP + '; [ -x "$R" ] || R=resetprop; "$R" -n ' + k + " " + quoteShell(now[k]) + ")";
    }).join("; "));
  }
  refreshPatchSummary();
  refreshSoter().catch(function(){});
}
async function savePatch(){
  var hash = document.getElementById("boot-hash").value.trim().toLowerCase();
  var boot = document.getElementById("patch-boot").value.trim();
  var sys = document.getElementById("patch-system").value.trim();
  var vendor = document.getElementById("patch-vendor").value.trim();
  if (hash && !/^[0-9a-f]{64}$/.test(hash)){ toast(t("toast.hashBad"), true); return; }
  var bad = [[boot, t("patch.boot")], [sys, t("patch.system")], [vendor, t("patch.vendor")]].filter(function(p){
    return p[0] && !/^\d{4}-\d{2}-\d{2}$/.test(p[0]);
  });
  if (bad.length){ toast(t("toast.patchBad", {field: bad[0][1]}), true); return; }
  /* 以表单为准重建我们管的那一整组：清空的项就从 props.conf 里去掉（空 = 不覆盖）。 */
  var kv = {};
  patchInputs().forEach(function(pair){
    var e = document.getElementById(pair[0]);
    var v = e ? String(e.value || "").trim() : "";
    if (v) kv[pair[1]] = v;
  });
  if (!(await writePropsKV(kv))) return;
  var now = {};
  if (boot) now["ro.boot.build.security_patch"] = boot;
  if (hash) now["ro.boot.vbmeta.digest"] = hash;
  var keys = Object.keys(now);
  if (keys.length){
    await exec(keys.map(function(k){
      return '(R=' + RESETPROP + '; [ -x "$R" ] || R=resetprop; "$R" -n ' + k + " " + quoteShell(now[k]) + ")";
    }).join("; "));
  }
  toast(keys.length ? t("toast.savedApplied") : t("toast.savedBoot"));
  refreshPatchSummary();
}

/* 从磁盘读一遍配置、伪装参数与版本。init 用一次，页面重新可见/拿回焦点时也用它 ——
   WebView 常把上次那页留着不重建，只在 init 里读会让人一直看到旧值（B 端就是这么中招的）。 */
async function readFromDisk(){
  var r = await exec(
    "cat " + CONF + " 2>/dev/null; echo '---P---'; cat " + PROPS + " 2>/dev/null; " +
    "echo '---M---'; cat " + MOD + "/module.prop 2>/dev/null"
  );
  var parts = r.stdout.split("---P---");
  curConfText = parts[0] || "";
  var parts2 = (parts[1] || "").split("---M---");
  curPropsText = parts2[0] || "";
  var prop = parts2[1] || "";
  var ver = "?";
  prop.split("\n").forEach(function(l){ if (l.indexOf("version=") === 0) ver = l.slice(8).trim(); });
  return ver;
}
/* 把 props.conf 里那几个键填进「伪装参数」的输入框和「当前」摘要。 */
async function propsToPatchFields(){
  var rp = {};
  curPropsText.split("\n").forEach(function(line){
    var m = /^([A-Za-z0-9_.]+)\s*:\s*(.*)$/.exec(line.trim());
    if (m && PROP_KEYS.indexOf(m[1]) >= 0) rp[m[1]] = m[2].trim();
  });
  patchValues = {
    "boot-hash": rp["ro.boot.vbmeta.digest"] || "",
    "patch-boot": rp["ro.boot.build.security_patch"] || ""
  };
  IDENT_FIELDS.forEach(function(pair){ patchValues[pair[0]] = rp[pair[1]] || ""; });
  fillPatchInputs();
  refreshPatchSummary();
}
/* 页面又露出来了（或者拿回焦点）就重读一次：没动过手的直接刷新，动过手的不碰 ——
   否则会把用户正在改、还没保存的东西冲掉。 */
var aDirty = false;
var lastRefresh = 0;
async function refreshFromDisk(){
  if (aDirty) return;
  /* 焦点事件可能连着来，2 秒内只读一次。 */
  var now = Date.now();
  if (now - lastRefresh < 2000) return;
  lastRefresh = now;
  try {
    await readFromDisk();
    renderRemote(parseKV(curConfText, true));
    propsToPatchFields();
    refreshStatus().catch(function(){});
    refreshSoter().catch(function(){});
    refreshCount().catch(function(){});
    refreshAttk().catch(function(){});
  } catch (e){}
}
document.addEventListener("visibilitychange", function(){ if (!document.hidden) refreshFromDisk(); });
if (typeof window !== "undefined" && window && typeof window.addEventListener === "function"){

       注意 LD_LIBRARY_PATH 只加给目标程序，别污染 timeout 自己的链接搜索路径。 */
    document.getElementById("rkp-fix").onclick = function(){
      runBusy("rkp-fix", t("kb.rkp.working"), function(){
        /* 直接跑写 ID 命令，不预先判断—— 判断只能靠猜，跑一遍才知道成不成。
           参数一律用占位符 `true rkp`：只写设备 ID，绝不把真 keybox 写进设备。 */
        var script = [
          "MOD=" + MOD + ";",
          "LIB=/vendor/lib64:/vendor/lib64/hw;",
          "try() { OUT=$(LD_LIBRARY_PATH=\"$1\" \"$2\" Keybox_file Device_ID true rkp 2>&1); echo \"$OUT\"; echo \"$OUT\" | grep -qi -e 'is done' -e 'provisioning complete'; };",
          "if [ -x /vendor/bin/KmInstallKeybox ]; then try /vendor/lib64:/vendor/lib64/hw /vendor/bin/KmInstallKeybox && exit 0; fi;",
          "if [ -x $MOD/KmInstallKeybox ]; then try /vendor/lib64/hw:/vendor/lib64 $MOD/KmInstallKeybox && exit 0; fi;",
          "echo RKP_WRITE_FAIL"
        ].join(" ");
        return exec(script).then(function(r){
          var out = ((r.stdout || "") + (r.stderr || "")).trim();
          if (out.indexOf("RKP_WRITE_FAIL") >= 0){ toast(t("kb.rkp.fail", {msg: out.replace("RKP_WRITE_FAIL", "").trim().slice(-140) || "-"}), true); return; }
          if (/provision.{0,40}complete/i.test(out) || /is done/i.test(out)){ toast(t("kb.rkp.ok")); return; }
          toast(t("kb.rkp.fail", {msg: out.slice(-160) || ("errno " + r.errno)}), true);
        });
      });

  } catch (e){
    document.getElementById("boot").textContent = t("toast.initFail", {msg: e.message});
  }
})();
