[package]
name = "ommega"
authors = ["jiyin004"]
version = "1.3.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[[bin]]
name = "keymint"
path = "src/main.rs"

[[bin]]
name = "webui"
path = "src/bin/webui.rs"

[dependencies]
syscalls = "0.8.1"
kmr-derive = { path = "derive" }
kmr-common = { path = "common" }
kmr-crypto-ommega = { path = "crypto" }
kmr-ta = { path = "ta" }
kmr-wire = { path = "wire" }
libc = "0.2.189"
prost = "0.14.4"
prost-types = "0.14.4"
hex = "0.4.3"
log4rs = "1.4.0"
log = "0.4.33"
rsbinder = { version = "0.10.0", features = ["android_12_plus", "rpc"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
anyhow = "1.0.104"
async-trait = "0.1.91"
tokio = { version = "1.53.1", features = ["macros", "libc"] }
lazy_static = "1.5.0"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
x509-cert = "0.3.0"
watchdog_rs = { path = "watchdog", version = "0.1.0" }
nix = { version = "0.31.3", features = ["fs", "mman"] }
rsproperties = { version = "0.6.0", features = ["builder"] }
libsqlite3-sys = "0.38.1"
rand = "0.10.2"
der = "0.8.1"
toml = "1.1.3"
regex = "1.13.1"
hotwatch = "0.5.0"
base64 = "0.23.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
goblin = "0.10.7"
ring = "0.17.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
android_logger = "0.15.1"
multi_log = "0.1.2"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic
strip = true        # Strip symbols from binary*
debug = 0           # Disable debug info
incremental = true

[workspace]
members = [
  "crypto",
  "common",
  "derive",
  "ta",
  "wire",
  "watchdog",
  "ommega-injector",
]

[patch.crates-io]
kmr-derive = { path = "derive" }
kmr-common = { path = "common" }
kmr-crypto-ommega = { path = "crypto" }
kmr-ta = { path = "ta" }
kmr-wire = { path = "wire" }
watchdog_rs = { path = "watchdog" }
ommega-injector = { path = "ommega-injector" }

[build-dependencies]
prost-build = "0.14.4"
rsbinder-aidl = "0.10.0"

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }
ciborium = "0.2.2"
rcgen = "0.14.8"
tempfile = "3.25.0"
