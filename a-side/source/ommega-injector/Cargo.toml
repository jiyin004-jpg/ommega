[package]
name = "ommega-injector"
authors = ["jiyin004"]
version = "1.6.9"
edition = "2021"
license = "AGPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "ommega-inject"
path = "src/main.rs"

[[bin]]
name = "inject-watchdog"
path = "src/bin/inject_watchdog.rs"

[dependencies]
libc = "0.2.189"
log = "0.4.33"
log4rs = "1.4.0"
kmr-common = { path = "../common" }
nix = { version = "0.31.3", features = ["ptrace", "signal"] }
lsplt-rs = "2.1.6"
anyhow = "1.0.104"
async-trait = "0.1.91"
rsbinder = { path = "../vendor/rsbinder", features = ["android_12_plus", "rpc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# SOTER 的 ASK/AuthKey 签名是 RSA-PSS-SHA256；`rsa 0.9` 自带 sha2 / rand_core
# 的 re-export，所以不额外引第二个版本，直接从 `rsa::sha2` 取。
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
toml = "1.1.3"
rand = "0.10.2"
android_logger = "0.15.1"
multi_log = "0.1.2"

[build-dependencies]
rsbinder-aidl = "0.10.0"
